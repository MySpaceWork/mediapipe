name: Build Box Tracking Demo

on:
  push:
    branches: ['*']
    paths:
      - 'box_tracking_demo/**'
      - '.github/workflows/build-box-tracking-demo.yml'
  pull_request:
    paths:
      - 'box_tracking_demo/**'
      - '.github/workflows/build-box-tracking-demo.yml'
  workflow_dispatch:

jobs:
  build-static-ubuntu:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ pkg-config \
            libgtk-3-dev \
            libavcodec-dev libavformat-dev libswscale-dev \
            libjpeg-dev libpng-dev libtiff-dev \
            zlib1g-dev

      - name: Cache OpenCV static build
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: /opt/opencv-static
          key: opencv-4.10.0-static-ubuntu22.04-v1

      - name: Build OpenCV from source (static)
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 4.10.0 https://github.com/opencv/opencv.git /tmp/opencv-src
          mkdir /tmp/opencv-build && cd /tmp/opencv-build
          cmake /tmp/opencv-src \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/opencv-static \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_LIST=core,imgproc,video,calib3d,highgui,videoio,imgcodecs,features2d \
            -DBUILD_TESTS=OFF \
            -DBUILD_PERF_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_opencv_apps=OFF \
            -DBUILD_opencv_python2=OFF \
            -DBUILD_opencv_python3=OFF \
            -DWITH_GTK=ON \
            -DWITH_FFMPEG=ON \
            -DWITH_JPEG=ON \
            -DWITH_PNG=ON \
            -DWITH_TIFF=ON \
            -DWITH_V4L=OFF \
            -DWITH_QT=OFF \
            -DWITH_OPENEXR=OFF \
            -DWITH_GSTREAMER=OFF \
            -DWITH_1394=OFF \
            -DOPENCV_GENERATE_PKGCONFIG=ON
          make -j$(nproc)
          sudo make install

      - name: Configure CMake (static build)
        working-directory: box_tracking_demo
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTATIC_BUILD=ON \
            -DOpenCV_DIR=/opt/opencv-static/lib/cmake/opencv4

      - name: Build
        working-directory: box_tracking_demo/build
        run: make -j$(nproc)

      - name: Verify binary
        working-directory: box_tracking_demo/build
        run: |
          ls -la box_tracking_demo
          file box_tracking_demo
          echo "--- Dynamic dependencies ---"
          ldd box_tracking_demo || true
          echo "--- Binary size ---"
          du -h box_tracking_demo

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: box_tracking_demo-linux-x86_64-static
          path: box_tracking_demo/build/box_tracking_demo
          retention-days: 90
